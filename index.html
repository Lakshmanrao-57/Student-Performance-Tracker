<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner Template - My Study Plan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #f4f5fa;
      --bg-sidebar: #5b51d8;
      --sidebar-hover: #4a41bd;
      --text-primary: #2d3748;
      --text-muted: #718096;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;

      --card-purple: linear-gradient(135deg, #6b63ff, #5146e5);
      --card-pink: linear-gradient(135deg, #ff6584, #f43f5e);
      --card-cyan: linear-gradient(135deg, #38bdf8, #0284c7);
      --card-green: linear-gradient(135deg, #34d399, #059669);

      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    body.dark-mode {
      --bg-main: #0f172a;
      --bg-sidebar: #1e1b4b;
      --sidebar-hover: #312e81;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: #1e293b;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-primary); display: flex; min-height: 100vh; }
    .app-container { display: flex; width: 100%; }

    /* Sidebar */
    .sidebar { width: 260px; background-color: var(--bg-sidebar); color: #fff; padding: 2rem 1.2rem; display: flex; flex-direction: column; flex-shrink: 0; }
    .brand h2 { font-size: 1.2rem; font-weight: 700; }
    .brand p { font-size: 0.85rem; opacity: 0.9; }
    .brand .tagline { display: block; font-size: 0.75rem; opacity: 0.6; margin-bottom: 2rem; }
    .nav-menu { display: flex; flex-direction: column; gap: 0.5rem; }
    .nav-btn { background: transparent; border: none; color: rgba(255, 255, 255, 0.8); padding: 0.75rem 1rem; border-radius: var(--radius-md); text-align: left; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 0.75rem; }
    .nav-btn:hover, .nav-btn.active { background-color: var(--sidebar-hover); color: #fff; }

    /* Main Area */
    .main-content { flex-grow: 1; padding: 2rem 2.5rem; overflow-y: auto; }
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .header-actions { display: flex; align-items: center; gap: 1rem; }

    .btn { padding: 0.6rem 1.2rem; border-radius: var(--radius-md); border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-primary { background-color: #5b51d8; color: #ffffff; }
    .btn-secondary { background-color: #e2e8f0; color: var(--text-primary); }
    .btn-icon { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Dashboard Widgets */
    .quote-banner { background-color: var(--card-bg); border-left: 4px solid #5b51d8; padding: 1rem 1.25rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-style: italic; color: var(--text-muted); box-shadow: var(--shadow); }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
    .metric-card { padding: 1.5rem; border-radius: var(--radius-lg); color: #ffffff; box-shadow: var(--shadow); }
    .metric-card h3 { font-size: 2.2rem; font-weight: 800; }
    .metric-card p { font-size: 0.85rem; opacity: 0.9; }

    .card-purple { background: var(--card-purple); }
    .card-pink { background: var(--card-pink); }
    .card-cyan { background: var(--card-cyan); }
    .card-green { background: var(--card-green); }

    .streak-banner { background-color: #fbbf24; color: #78350f; padding: 1rem 1.5rem; border-radius: var(--radius-lg); display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .widget-card { background-color: var(--card-bg); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); margin-bottom: 1.5rem; box-shadow: var(--shadow); }

    /* Calendar Grid */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.75rem; margin-top: 1rem; }
    .calendar-day { background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem 0.5rem; text-align: center; }
    .calendar-day.today { border-color: #5b51d8; background-color: rgba(91, 81, 216, 0.1); }
    .day-name { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .day-num { font-size: 1.2rem; font-weight: 700; margin-top: 0.3rem; }

    /* Timer Widget */
    .timer-box { background: linear-gradient(135deg, #5b51d8, #4338ca); color: #ffffff; padding: 2.5rem; text-align: center; border-radius: var(--radius-lg); margin-top: 1rem; }
    .timer-display { font-size: 4rem; font-weight: 800; margin: 1rem 0; font-family: monospace; }
    .timer-controls { display: flex; justify-content: center; gap: 1rem; }
    .btn-control { background-color: rgba(255, 255, 255, 0.9); color: #4338ca; font-weight: 700; }

    /* Task Items */
    .task-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .task-card { background-color: var(--card-bg); padding: 1rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .task-card.completed { opacity: 0.6; text-decoration: line-through; }
    .btn-delete { color: #ef4444; background: transparent; border: none; cursor: pointer; font-size: 1rem; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: all 0.2s; z-index: 1000; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-card { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: var(--radius-lg); padding: 1.5rem; }
    .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group input, .form-group select { padding: 0.6rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">
        <h2>Study Planner</h2>
        <p>-- My Study Plan</p>
        <span class="tagline">Learn. Note. Review.</span>
      </div>
      <nav class="nav-menu">
        <button class="nav-btn active" data-tab="dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
        <button class="nav-btn" data-tab="topics"><i class="fa-solid fa-book-open"></i> Topics</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1 id="page-title">Dashboard</h1>
        <div class="header-actions">
          <button id="add-task-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Task</button>
          <button id="theme-toggle" class="btn-icon"><i class="fa-solid fa-moon"></i></button>
        </div>
      </header>

      <!-- DASHBOARD TAB -->
      <section id="dashboard-view" class="tab-content active">
        <div class="quote-banner"><p>"Learning never exhausts the mind." - <span>Leonardo da Vinci</span></p></div>
        <div class="metrics-grid">
          <div class="metric-card card-purple"><h3 id="stat-total-topics">0</h3><p>Total Topics</p></div>
          <div class="metric-card card-pink"><h3 id="stat-completed">0</h3><p>Completed</p></div>
          <div class="metric-card card-cyan"><h3 id="stat-study-hours">0.0</h3><p>Study Hours</p></div>
          <div class="metric-card card-green"><h3 id="stat-completion-rate">0%</h3><p>Completion Rate</p></div>
        </div>

        <div class="streak-banner">
          <div><h4 id="stat-streak-count">0</h4><p>Day Streak</p></div>
          <button id="checkin-btn" class="btn btn-secondary">Daily Check-in</button>
        </div>

        <div class="widget-card">
          <h3>Weekly Calendar</h3>
          <div class="calendar-grid" id="weekly-calendar"></div>
        </div>

        <div class="widget-card">
          <h3>Pomodoro Timer</h3>
          <div class="timer-box">
            <p>Focus Session</p>
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-controls">
              <button id="start-timer-btn" class="btn btn-control">Start</button>
              <button id="pause-timer-btn" class="btn btn-control">Pause</button>
              <button id="reset-timer-btn" class="btn btn-control">Reset</button>
            </div>
          </div>
        </div>
      </section>

      <!-- TOPICS TAB -->
      <section id="topics-view" class="tab-content">
        <h2>Tasks & Topics</h2>
        <div class="task-list" id="task-list-container" style="margin-top: 1rem;"></div>
      </section>
    </main>
  </div>
  
  <!-- TASK MODAL -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal-card">
      <h3>Create New Task</h3>
      <form id="task-form" style="margin-top: 1rem;">
        <div class="form-group">
          <label>Task Title</label>
          <input type="text" id="task-title-input" required placeholder="e.g., Solve 5 Graph Algorithms">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="task-category-input">
            <option value="DSA">DSA</option>
            <option value="Aptitude">Aptitude</option>
            <option value="Core Subjects">Core Subjects</option>
          </select>
        </div>
        <div class="form-group">
          <label>Deadline Date</label>
          <input type="date" id="task-deadline-input" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
          <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. Storage Manager
    const Storage = {
      KEYS: { TASKS: 'planner_tasks', HOURS: 'planner_hours', STREAK: 'planner_streak', CHECKIN: 'planner_checkin' },
      getTasks() { return JSON.parse(localStorage.getItem(this.KEYS.TASKS)) || []; },
      saveTask(t) { const tasks = this.getTasks(); tasks.push(t); localStorage.setItem(this.KEYS.TASKS, JSON.stringify(tasks)); },
      toggleTask(id) {
        const tasks = this.getTasks().map(t => { if(t.id === id) t.completed = !t.completed; return t; });
        localStorage.setItem(this.KEYS.TASKS, JSON.stringify(tasks));
      },
      deleteTask(id) {
        const tasks = this.getTasks().filter(t => t.id !== id);
        localStorage.setItem(this.KEYS.TASKS, JSON.stringify(tasks));
      },
      getHours() { return parseFloat(localStorage.getItem(this.KEYS.HOURS)) || 0.0; },
      addHours(h) { const updated = (this.getHours() + h).toFixed(1); localStorage.setItem(this.KEYS.HOURS, updated); return updated; },
      getStreak() { return parseInt(localStorage.getItem(this.KEYS.STREAK)) || 0; },
      checkIn() {
        const today = new Date().toISOString().split('T')[0];
        const last = localStorage.getItem(this.KEYS.CHECKIN);
        if (last === today) return false;
        let streak = this.getStreak() + 1;
        localStorage.setItem(this.KEYS.STREAK, streak);
        localStorage.setItem(this.KEYS.CHECKIN, today);
        return streak;
      }
    };

    // 2. Pomodoro Timer
    const Pomodoro = {
      seconds: 25 * 60, timer: null, running: false,
      start() {
        if (this.running) return;
        this.running = true;
        this.timer = setInterval(() => {
          this.seconds--;
          this.updateDisplay();
          if (this.seconds <= 0) {
            this.pause(); this.seconds = 25 * 60; this.updateDisplay();
            alert("Focus Session Complete! +0.4 Hours logged.");
            document.getElementById('stat-study-hours').textContent = Storage.addHours(0.4);
          }
        }, 1000);
      },
      pause() { clearInterval(this.timer); this.running = false; },
      reset() { this.pause(); this.seconds = 25 * 60; this.updateDisplay(); },
      updateDisplay() {
        const m = Math.floor(this.seconds / 60), s = this.seconds % 60;
        document.getElementById('timer-display').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
    };

    // 3. Calendar Render
    function renderCalendar() {
      const container = document.getElementById('weekly-calendar');
      container.innerHTML = '';
      const today = new Date(), sunday = new Date(today);
      sunday.setDate(today.getDate() - today.getDay());
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      for (let i = 0; i < 7; i++) {
        const d = new Date(sunday); d.setDate(sunday.getDate() + i);
        const isToday = d.toDateString() === today.toDateString();
        container.innerHTML += `
          <div class="calendar-day ${isToday ? 'today' : ''}">
            <div class="day-name">${days[i]}</div>
            <div class="day-num">${d.getDate()}</div>
          </div>`;
      }
    }

    // 4. Application Logic
    window.toggleTask = (id) => { Storage.toggleTask(id); refreshUI(); };
    window.deleteTask = (id) => { Storage.deleteTask(id); refreshUI(); };

    document.addEventListener('DOMContentLoaded', () => {
      renderCalendar();

      // Navigation
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          const tab = btn.getAttribute('data-tab');
          document.getElementById(`${tab}-view`).classList.add('active');
          document.getElementById('page-title').textContent = btn.textContent.trim();
        };
      });

      // Modals & Controls
      document.getElementById('add-task-btn').onclick = () => document.getElementById('task-modal').classList.add('active');
      document.getElementById('cancel-modal-btn').onclick = () => document.getElementById('task-modal').classList.remove('active');

      document.getElementById('task-form').onsubmit = (e) => {
        e.preventDefault();
        Storage.saveTask({
          id: Date.now().toString(),
          title: document.getElementById('task-title-input').value,
          category: document.getElementById('task-category-input').value,
          deadline: document.getElementById('task-deadline-input').value,
          completed: false
        });
        document.getElementById('task-form').reset();
        document.getElementById('task-modal').classList.remove('active');
        refreshUI();
      };

      // Timer Controls
      document.getElementById('start-timer-btn').onclick = () => Pomodoro.start();
      document.getElementById('pause-timer-btn').onclick = () => Pomodoro.pause();
      document.getElementById('reset-timer-btn').onclick = () => Pomodoro.reset();

      // Streak Control
      document.getElementById('checkin-btn').onclick = () => {
        const res = Storage.checkIn();
        if (res) alert(`Check-in complete! Streak: ${res} days 🔥`);
        else alert("Already checked in today!");
        refreshUI();
      };

      // Theme Toggle
      document.getElementById('theme-toggle').onclick = () => document.body.classList.toggle('dark-mode');

      refreshUI();
    });

    function refreshUI() {
      const tasks = Storage.getTasks();
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;

      document.getElementById('stat-total-topics').textContent = total;
      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('stat-study-hours').textContent = Storage.getHours();
      document.getElementById('stat-completion-rate').textContent = total ? `${Math.round((completed / total) * 100)}%` : '0%';
      document.getElementById('stat-streak-count').textContent = Storage.getStreak();

      const container = document.getElementById('task-list-container');
      if (!tasks.length) {
        container.innerHTML = `<p style="color:var(--text-muted);">No tasks added yet.</p>`;
        return;
      }

      container.innerHTML = tasks.map(t => `
        <div class="task-card ${t.completed ? 'completed' : ''}">
          <div>
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="window.toggleTask('${t.id}')">
            <span style="margin-left: 0.5rem; font-weight: 600;">${t.title}</span>
            <small style="color: var(--text-muted); margin-left: 0.5rem;">(${t.category})</small>
          </div>
          <div>
            <span style="font-size: 0.85rem; color: var(--text-muted); margin-right: 1rem;">${t.deadline}</span>
            <button class="btn-delete" onclick="window.deleteTask('${t.id}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
